# Grafana Live demo: Grafana + two data generators (HTTP push and WebSocket push).
# All ports are bound to 127.0.0.1 only, so the demo is not reachable from the network.
x-generator-env: &generator-env
  GRAFANA_URL: http://grafana:3000
  GRAFANA_USER: admin
  GRAFANA_PASSWORD: ${GRAFANA_PASSWORD:-admin}
  INTERVAL_MS: "200"

services:
  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: http://localhost:3000
      # Grafana Live accepts WebSocket connections only from allowed origins.
      GF_LIVE_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # Pushes to channels stream/http/<measurement> (dashboard: live-http)
  generator-http:
    build: ./generator
    environment:
      <<: *generator-env
      PUSH_MODE: http
      STREAM_ID: http
    depends_on:
      - grafana
    restart: unless-stopped

  # Pushes to channels stream/ws/<measurement> (dashboard: live-ws)
  generator-ws:
    build: ./generator
    environment:
      <<: *generator-env
      PUSH_MODE: ws
      STREAM_ID: ws
    depends_on:
      - grafana
    restart: unless-stopped

volumes:
  grafana-data:
